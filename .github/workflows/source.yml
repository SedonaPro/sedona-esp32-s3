name: Source build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sedona-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: python3 build.py sedona --profile qemu
